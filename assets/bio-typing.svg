<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 34" width="460" height="34">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .text-light { fill: #E6EDF3; font-size: 12.5px; }
      .text-dim { fill: #8B949E; }
    </style>
  </defs>

  <!-- Container Pill -->
  <rect width="460" height="34" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>

  <!-- Live Pulse Indicator -->
  <circle cx="16" cy="17" r="3.5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Prompt Caret -->
  <text x="28" y="22" class="mono" font-size="13" font-weight="600" fill="#FB923C">›</text>

  <!-- Role 1: Origin / Stack (0s - 3s) -->
  <g opacity="1">
    <text x="44" y="21.5" class="mono text-light">sysadmin · devops · fullstack · AI architect</text>
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.97;0.975;0.98;0.985;0.99;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Role 2: Audiophile / Analog (3s - 6s) -->
  <g opacity="0">
    <text x="44" y="21.5" class="mono text-light">audiophile · homelab · hi-fi</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.245;0.265;0.47;0.5;0.505;0.51;0.515;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Role 3: Enterprise / SaaS (6s - 9s) -->
  <g opacity="0">
    <text x="44" y="21.5" class="mono text-light">Director of SaaS at Orpheus</text>
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.495;0.505;0.515;0.72;0.75;0.755;0.76;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Role 4: Lab / Agency (9s - 12s) -->
  <g opacity="0">
    <text x="44" y="21.5" class="mono text-light">Founder of athrLabs</text>
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.745;0.755;0.765;0.97;0.995;0.998;0.999;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Adaptive Cursor tracking text end -->
  <rect y="9" width="2" height="15" rx="1" fill="#FB923C">
    <!-- Tracks text ending position for each role -->
    <animate attributeName="x"
      values="386;386;269;269;262;262;207;207;386"
      keyTimes="0;0.245;0.25;0.495;0.5;0.745;0.75;0.995;1"
      calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <!-- Blinking cursor -->
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
