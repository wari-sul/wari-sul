<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 28" width="296" height="28">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .text-light { fill: #E6EDF3; font-size: 12px; }
    </style>
  </defs>

  <!-- Container Pill -->
  <rect width="296" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>

  <!-- Live Pulse Indicator -->
  <circle cx="13" cy="14" r="3" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Prompt Caret -->
  <text x="23" y="18" class="mono" font-size="12" font-weight="600" fill="#FB923C">›</text>

  <!-- Text -->
  <text x="36" y="18" class="mono text-light">Director of SaaS Dept. at Orpheus</text>

  <!-- Blinking Cursor -->
  <rect x="279" y="6" width="2" height="15" rx="1" fill="#FB923C">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
