<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 156" width="420" height="156">
  <!-- Card background -->
  <rect width="420" height="156" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>

  <!-- Title bar -->
  <circle cx="16" cy="16" r="4" fill="#FF5F57" opacity="0.8"/>
  <circle cx="30" cy="16" r="4" fill="#FFBD2E" opacity="0.8"/>
  <circle cx="44" cy="16" r="4" fill="#28CA41" opacity="0.8"/>
  <text x="60" y="20" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#484F58">~/about</text>
  <line x1="0" y1="32" x2="420" y2="32" stroke="#30363D" stroke-width="1"/>

  <!-- Row 1: work -->
  <g opacity="0">
    <text x="16" y="54" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">›</text>
    <text x="30" y="54" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">work</text>
    <text x="80" y="54" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#484F58">·</text>
    <text x="96" y="54" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#E6EDF3">Director of SaaS at Orpheus</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze"/>
  </g>

  <!-- Row 2: lab -->
  <g opacity="0">
    <text x="16" y="80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">›</text>
    <text x="30" y="80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">lab</text>
    <text x="80" y="80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#484F58">·</text>
    <text x="96" y="80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#E6EDF3">Founder of athrLabs</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.0s" fill="freeze"/>
  </g>

  <!-- Row 3: stack -->
  <g opacity="0">
    <text x="16" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">›</text>
    <text x="30" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">stack</text>
    <text x="80" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#484F58">·</text>
    <text x="96" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#E6EDF3">sysadmin · devops · fullstack</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
  </g>

  <!-- Row 4: analog -->
  <g opacity="0">
    <text x="16" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">›</text>
    <text x="30" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#FB923C">analog</text>
    <text x="80" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#484F58">·</text>
    <text x="96" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#E6EDF3">audiophile · homelab · hi-fi</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/>
  </g>

  <!-- Blinking cursor after last row -->
  <rect x="308" y="121" width="2" height="14" rx="1" fill="#FB923C" opacity="0">
    <animate attributeName="opacity" values="1;0" dur="1s" begin="2.5s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
</svg>
