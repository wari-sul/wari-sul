<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="100" viewBox="0 0 1500 100" role="img" aria-label="Certifications: AWS Cloud Solutions Architect, Google Cybersecurity Certificate, IBM Full Stack Software Developer, Microsoft Cybersecurity Analyst, Meta React Native Specialization">
  <title>Certifications</title>
  <defs>
    <style>
      .chip { fill: #0d1420; stroke: #1e293b; }
      .provider { font: 700 9.5px -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.6px; fill: #8b9bb4; }
      .focus { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #e6ebf4; }
      .mono { font: 800 15px -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- 1 · AWS -->
  <g transform="translate(0,8)">
    <rect class="chip" x="0" y="0" width="288" height="84" rx="14"/>
    <rect x="2" y="16" width="4" height="52" rx="2" fill="#FF9900"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#FF9900" fill-opacity="0.12" stroke="#FF9900"/>
    <text class="mono" x="36" y="48" text-anchor="middle" font-size="14" fill="#FF9900">aws</text>
    <text class="provider" x="68" y="36">AMAZON WEB SERVICES</text>
    <text class="focus" x="68" y="57">Cloud Solutions Architect</text>
  </g>

  <!-- 2 · Google -->
  <g transform="translate(303,8)">
    <rect class="chip" x="0" y="0" width="288" height="84" rx="14"/>
    <rect x="2" y="16" width="4" height="52" rx="2" fill="#4285F4"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#4285F4" fill-opacity="0.12" stroke="#4285F4"/>
    <text class="mono" x="36" y="50" text-anchor="middle" font-size="20" fill="#4285F4">G</text>
    <text class="provider" x="68" y="36">GOOGLE</text>
    <text class="focus" x="68" y="57">Cybersecurity Certificate</text>
  </g>

  <!-- 3 · IBM -->
  <g transform="translate(606,8)">
    <rect class="chip" x="0" y="0" width="288" height="84" rx="14"/>
    <rect x="2" y="16" width="4" height="52" rx="2" fill="#0F62FE"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#0F62FE" fill-opacity="0.12" stroke="#0F62FE"/>
    <text class="mono" x="36" y="47" text-anchor="middle" font-size="13" letter-spacing="1" fill="#0F62FE">IBM</text>
    <text class="provider" x="68" y="36">IBM</text>
    <text class="focus" x="68" y="57">Full Stack Software Developer</text>
  </g>

  <!-- 4 · Microsoft -->
  <g transform="translate(909,8)">
    <rect class="chip" x="0" y="0" width="288" height="84" rx="14"/>
    <rect x="2" y="16" width="4" height="52" rx="2" fill="#5E5E5E"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#5E5E5E" fill-opacity="0.12" stroke="#5E5E5E"/>
    <rect x="27" y="33" width="7.5" height="7.5" fill="#8a8a8a"/>
    <rect x="37.5" y="33" width="7.5" height="7.5" fill="#5E5E5E"/>
    <rect x="27" y="43.5" width="7.5" height="7.5" fill="#5E5E5E"/>
    <rect x="37.5" y="43.5" width="7.5" height="7.5" fill="#8a8a8a"/>
    <text class="provider" x="68" y="36">MICROSOFT</text>
    <text class="focus" x="68" y="57">Cybersecurity Analyst</text>
  </g>

  <!-- 5 · Meta -->
  <g transform="translate(1212,8)">
    <rect class="chip" x="0" y="0" width="288" height="84" rx="14"/>
    <rect x="2" y="16" width="4" height="52" rx="2" fill="#0866FF"/>
    <rect x="16" y="22" width="40" height="40" rx="10" fill="#0866FF" fill-opacity="0.12" stroke="#0866FF"/>
    <circle cx="31.2" cy="42" r="6.5" fill="none" stroke="#0866FF" stroke-width="2.4"/>
    <circle cx="40.8" cy="42" r="6.5" fill="none" stroke="#0866FF" stroke-width="2.4"/>
    <text class="provider" x="68" y="36">META</text>
    <text class="focus" x="68" y="57">React Native Specialization</text>
  </g>
</svg>
