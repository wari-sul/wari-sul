<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 34" width="250" height="34">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .text-light { fill: #E6EDF3; font-size: 12.5px; }
    </style>
  </defs>

  <!-- Container Pill -->
  <rect width="250" height="34" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>

  <!-- Live Pulse Indicator -->
  <circle cx="15" cy="17" r="3.5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Prompt Caret -->
  <text x="26" y="21.5" class="mono" font-size="13" font-weight="600" fill="#FB923C">›</text>

  <!-- Text 1: The Journey -->
  <g opacity="1">
    <text x="42" y="21.5" class="mono text-light">The Journey</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.50;0.95;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Text 2: Sysadmin to AI Architect -->
  <g opacity="0">
    <text x="42" y="21.5" class="mono text-light">Sysadmin to AI Architect</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.47;0.52;0.95;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Adaptive Cursor -->
  <rect y="9" width="2" height="15" rx="1" fill="#FB923C">
    <animate attributeName="x" values="132;132;230;230;132" keyTimes="0;0.47;0.52;0.98;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
